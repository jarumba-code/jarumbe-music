# Alembic configuration for Jarumba Music.
#
# NOTE: the database URL is deliberately NOT set here.  It is resolved at
# runtime by alembic/env.py from app.config.get_settings(), which reads the
# existing DATABASE_URL from the environment / .env file.  Keeping the URL in
# Python code (and out of this committed file) avoids leaking the Supabase
# connection string and guarantees migrations always target the same database
# the application talks to.
#
# Usage (run from services/api):
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, descriptive revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate the slug so long messages do not produce unwieldy filenames.
truncate_slug_length = 40

# Timezone used for the %(year)d etc. tokens above.
timezone = UTC

# Uncomment to emit the full DDL that a migration would run.
# output_encoding = utf-8

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
