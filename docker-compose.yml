services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: jarumba-api:local
    environment:
      ENVIRONMENT: development
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://jarumba:jarumba@postgres:5432/jarumba
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_JWT_SECRET: ""
      JAMENDO_CLIENT_ID: "test_client_id_for_local_docker"
      JAMENDO_CLIENT_SECRET: "local-dummy-secret"
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: ""
      RATE_LIMIT_ALLOW_MEMORY_FALLBACK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jarumba
      POSTGRES_USER: jarumba
      POSTGRES_PASSWORD: jarumba
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/local-postgres-init.sql:/docker-entrypoint-initdb.d/001-local-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarumba -d jarumba"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
